<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Install DOOM</title>
<style>
  html, body { background: #1b1b1b; }
  body { margin: 20px; color: #ddd; font: 14px sans-serif; }
  h1 { margin: 0 0 12px; color: #c33; font-size: 22px; }
  /* Not white: readable even if Packet Tracer draws the page on white. */
  code, b { color: #e8a33d; font-weight: bold; }
  #log { margin-top: 14px; color: #9c9; font: 13px monospace; white-space: pre-wrap; }
  #log .err { color: #f66; }
</style>
</head>
<body>
<h1>Install DOOM</h1>
<p>DOOM-PC has the DOOM engine but no game data. Choose a DOOM WAD file,
for example the free shareware <b>doom1.wad</b>. <code>doom.wad</code>,
<code>doom2.wad</code> and Freedoom's WADs are accepted too.</p>
<input type="file" id="pick" accept=".wad,.WAD">
<div id="log"></div>
<script>
// Runs inside the .pkt's File Script Module (pt/installer/ptdoom.js opens it).
// Everything happens here: the page reads the WAD, checks it, draws the
// Desktop icon from it and writes both into every PC that has the DOOM app,
// through Packet Tracer's asynchronous IPC calls for web views.
var ID = "com.ptdoom.doom";
var FOLDER = ID + " (Python)";
// The engine looks for these names in its working directory.
var NAMES = ["doom1.wad", "doom.wad", "doom2.wad", "plutonia.wad", "tnt.wad",
             "freedoom1.wad", "freedoom2.wad"];

var logEl = document.getElementById("log");
function log(text, isError) {
  var line = document.createElement("div");
  if (isError) line.className = "err";
  line.textContent = text;
  logEl.appendChild(line);
}

function call(obj, name, args) {
  return new Promise(function (resolve) { obj.ipcCallArgsAsync(name, args || [], resolve); });
}

function lumps(bytes) {
  var view = new DataView(bytes.buffer);
  var count = view.getInt32(4, true), offset = view.getInt32(8, true), out = {};
  for (var i = 0; i < count; i++) {
    var at = offset + 16 * i, name = "";
    for (var j = 0; j < 8 && bytes[at + 8 + j]; j++) name += String.fromCharCode(bytes[at + 8 + j]);
    out[name] = bytes.subarray(view.getInt32(at, true), view.getInt32(at, true) + view.getInt32(at + 4, true));
  }
  return out;
}

// Doomguy's status-bar face on a dark square, as base64 PNG (no data: prefix),
// the form Packet Tracer keeps binary files in.
function makeIcon(wad) {
  var face = wad.STFST01, pal = wad.PLAYPAL;
  if (!face || !pal) return null;
  var view = new DataView(face.buffer, face.byteOffset, face.byteLength);
  var w = view.getInt16(0, true), h = view.getInt16(2, true);
  var small = document.createElement("canvas");
  small.width = w; small.height = h;
  var sctx = small.getContext("2d"), img = sctx.createImageData(w, h);
  for (var x = 0; x < w; x++) {
    var pos = view.getInt32(8 + 4 * x, true);
    while (face[pos] !== 255) {
      var top = face[pos], len = face[pos + 1];
      for (var i = 0; i < len; i++) {
        var c = face[pos + 3 + i] * 3, p = ((top + i) * w + x) * 4;
        img.data[p] = pal[c]; img.data[p + 1] = pal[c + 1]; img.data[p + 2] = pal[c + 2]; img.data[p + 3] = 255;
      }
      pos += len + 4;
    }
  }
  sctx.putImageData(img, 0, 0);
  var icon = document.createElement("canvas");
  icon.width = icon.height = 100;
  var ctx = icon.getContext("2d");
  ctx.fillStyle = "rgb(40,8,8)";
  ctx.fillRect(0, 0, 100, 100);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(small, (100 - 3 * w) >> 1, (100 - 3 * h) >> 1, 3 * w, 3 * h);
  return icon.toDataURL("image/png").split(",")[1];
}

function toBase64(bytes) {
  var parts = [];
  for (var i = 0; i < bytes.length; i += 0x8000) {
    parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)));
  }
  return btoa(parts.join(""));
}

async function install(name, bytes) {
  var files = {
    "[gui]wad.js": "window.DOOM_WAD=" + JSON.stringify({ name: name, data: toBase64(bytes) }) + ";\n"
  };
  var icon = makeIcon(lumps(bytes));
  if (icon) files["[gui]icon.png"] = icon;

  var net = await call(ipc, "network");
  var count = await call(net, "getDeviceCount");
  var done = [];
  for (var i = 0; i < count; i++) {
    var dev = await call(net, "getDeviceAt", [i]);
    if (!(await call(dev, "getUserDesktopAppById", [ID]))) continue;
    var fm = await call(dev, "getProcess", ["FileManager"]);
    var fs = await call(fm, "getFileSystem", ["Dev:"]);
    var dir = await call(fs, "getFile", [FOLDER]);
    for (var file in files) {
      // addTextFile won't replace a file.
      if (await call(dir, "fileExist", [file])) await call(dir, "removeFile", [file, true]);
      if (!(await call(dir, "addTextFile", [file, files[file], true]))) throw new Error("could not write " + file);
    }
    done.push(await call(dev, "getName"));
  }
  return done;
}

document.getElementById("pick").addEventListener("change", async function () {
  var file = this.files[0];
  if (!file) return;
  logEl.textContent = "";
  var name = file.name.toLowerCase();
  if (NAMES.indexOf(name) === -1) {
    log(file.name + ": the engine only finds WADs named " + NAMES.join(", ") + ". Rename the file if it's one of those.", true);
    return;
  }
  var bytes = new Uint8Array(await file.arrayBuffer());
  var magic = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
  if (magic !== "IWAD") {
    log(file.name + " isn't a DOOM game WAD (it starts with " + JSON.stringify(magic) + ", not \"IWAD\").", true);
    return;
  }
  log("Installing " + name + " (" + (bytes.length / 1048576).toFixed(1) + " MB)...");
  try {
    var pcs = await install(name, bytes);
    if (!pcs.length) { log("No PC on the canvas has the DOOM app.", true); return; }
    log("Installed on " + pcs.join(", ") + ".");
    log("\nNow save the file under a new name (File > Save As), then click " + pcs[0] + " > Desktop > DOOM.");
  } catch (e) {
    log("Install failed: " + e.message, true);
  }
});
</script>
</body>
</html>
