<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DOS</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #msg { padding: 16px; color: #ccc; font: 14px monospace; }
</style>
</head>
<body>
<div id="msg">loading...</div>
<script>
// The play window: the DOS app in a window of its own, opened from the games
// window (ptdos.js). Unlike a PC's Desktop window, this one lets the page
// lock the mouse (click the screen; Esc releases it), which a game like
// Quake needs: in a PC's window the mouse stops at the window's edges.
// The games live in a PC's DOS app, so read the app's page and scripts
// through IPC, turn each script into a blob URL, and replace this page with
// the app's page pointing at them. Blob URLs rather than inline scripts:
// a game can be 190 MB of text.
var FOLDER = "com.ptdoom.dos (Python)";

function call(obj, name, args) {
  if (!obj) return Promise.reject(new Error("no object for " + name + " (Packet Tracer not ready?)"));
  return new Promise(function (resolve) { obj.ipcCallArgsAsync(name, args || [], resolve); });
}

var msgEl = document.getElementById("msg");
function step(text) { msgEl.textContent = text; }

async function readAppFile(dir, name) {
  step("reading " + name + "...");
  var file = await call(dir, "getFile", [name]);
  if (!file) throw new Error(name + " is missing");
  var content = await call(file, "getContent", [true]);
  if (!content || typeof content.text !== "string") throw new Error("no text in " + name);
  return content.text;
}

// The first PC whose DOS app has games, else the first with the app.
async function appDir() {
  var net = await call(typeof ipc === "undefined" ? null : ipc, "network"), count = net ? await call(net, "getDeviceCount") : 0, first = null;
  for (var i = 0; i < count; i++) {
    var dev = await call(net, "getDeviceAt", [i]);
    var fm = dev && await call(dev, "getProcess", ["FileManager"]);
    var fs = fm && await call(fm, "getFileSystem", ["Dev:"]);
    var dir = fs && await call(fs, "getFile", [FOLDER]);
    if (!dir) continue;
    first = first || { dir: dir, pc: await call(dev, "getName") };
    var list = await call(dir, "fileExist", ["games.json"]) ? await readAppFile(dir, "games.json") : "[]";
    if (JSON.parse(list || "[]").length) return { dir: dir, pc: await call(dev, "getName") };
  }
  return first;
}

async function start() {
  step("finding the DOS app...");
  var found, lastError = null;
  // Just after the file opens the PCs, or ipc itself, may not be readable
  // yet: try for a few seconds, errors included.
  for (var tries = 0; tries < 10 && !found; tries++) {
    if (tries) await new Promise(function (r) { setTimeout(r, 1000); });
    try { found = await appDir(); lastError = null; } catch (e) { lastError = e; }
  }
  if (lastError) throw lastError;
  if (!found) throw new Error("no PC on the canvas has the DOS app");
  var page = await readAppFile(found.dir, "[gui]index.html");
  var srcs = [], re = /<script src="([^"]+)"><\/script>/g, m;
  while ((m = re.exec(page))) srcs.push(m[1]);
  for (var i = 0; i < srcs.length; i++) {
    var text = await readAppFile(found.dir, "[gui]" + srcs[i]);
    var url = URL.createObjectURL(new Blob([text], { type: "text/javascript" }));
    text = null;
    page = page.split('<script src="' + srcs[i] + '"><\/script>').join('<script src="' + url + '"><\/script>');
  }
  // Tell the app's page it's in the play window (web/v86-dos.js: the click
  // that locks the mouse doesn't reach the game).
  if (page.indexOf("<head>") < 0) throw new Error("unexpected app page");
  page = page.split("<head>").join("<head><script>window.PTDOS_PLAY_WINDOW=true<\/script>");
  step("starting (" + found.pc + ")...");
  document.open();
  document.write(page);
  document.close();
  document.title = "DOS (" + found.pc + ")";
}

start().catch(function (e) { step("Couldn't start: " + e.message); });
</script>
</body>
</html>
